<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Coaching Staff | Clackamas United</title>
</head>
<body class="bg-white">

    <div id="page-content">
        <section class="py-20 max-w-7xl mx-auto px-6">
            <div class="mb-16 border-l-8 border-[#E21E26] pl-8">
                <h1 class="text-6xl font-display font-bold uppercase italic italic text-[#111111]">Coaching <span class="text-[#E21E26]">Staff</span></h1>
                <p class="text-gray-500 font-bold uppercase tracking-widest mt-2">Technical Leadership & Player Development</p>
            </div>

            <!-- Coach Selector -->
            <div class="max-w-2xl mx-auto mb-12">
                <label for="coach-selector" class="block text-sm font-medium text-gray-700 mb-2">Learn more about a coach:</label>
                <select id="coach-selector" class="block w-full p-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-cu-red focus:border-cu-red text-lg">
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>

            <!-- Coach Details Container -->
            <div id="coach-details" class="max-w-4xl mx-auto">
                <!-- Coach info will be injected here -->
            </div>

        </section>
    </div>

    <script src="/theme.js"></script>
    <script src="/sponsors-data.js"></script>
    <script src="/about/coaches-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            siteTheme.init("/");

            const selector = document.getElementById('coach-selector');
            const detailsContainer = document.getElementById('coach-details');
            // Filter and sort coaches alphabetically by name
            const visibleCoaches = coachesData
                .filter(coach => !coach.hidden)
                .sort((a, b) => a.name.localeCompare(b.name));

            // Function to display a coach's details
            const displayCoach = (coach) => {
                const emailLink = coach.email ? `<a href="mailto:${coach.email}" class="text-sm font-medium border-b border-black/10 pb-1 hover:border-[#E21E26]">${coach.email}</a>` : '';

                let photoHTML = '';
                const clubLogoPath = '/images/club-logo.png';
                // Check if photo is missing or is the placeholder
                if (!coach.photo || coach.photo.includes('placeholder.jpg')) {
                    // Use the club logo with a "watermark" style
                    photoHTML = `<div class="flex justify-center items-center bg-slate-100 rounded-lg shadow-md w-full max-w-xs lg:max-w-full aspect-[4/5] p-8">
                                    <img src="${clubLogoPath}" alt="Clackamas United Logo" class="w-full h-full object-contain opacity-40 grayscale">
                                 </div>`;
                } else {
                    photoHTML = `<img src="${coach.photo}" alt="Photo of ${coach.name}" class="rounded-lg shadow-md w-full max-w-xs lg:max-w-full object-cover aspect-[4/5]">`;
                }

                let teamsHTML = '';
                if (coach.teams && coach.teams.length > 0) {
                    const teamsList = coach.teams.map(team => `<li class="bg-gray-100 text-gray-800 text-sm font-semibold mr-2 mb-2 px-3 py-1 rounded-full">${team}</li>`).join('');
                    teamsHTML = `
                        <div class="mt-8 pt-8 border-t border-gray-200">
                            <h3 class="text-xl font-display font-bold uppercase text-center mb-4">Current Teams</h3>
                            <ul class="flex flex-wrap justify-center">${teamsList}</ul>
                        </div>`;
                }
                
                detailsContainer.innerHTML = `
                    <div class="bg-white shadow-xl border-t-8 border-cu-red p-8 md:p-12 animate-fade-in">
                        <div class="text-center mb-8">
                            <h2 class="text-4xl font-display font-bold uppercase text-cu-red">${coach.name}</h2>
                            <p class="text-gray-600 font-bold text-lg uppercase tracking-wider mt-1">${coach.title}</p>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-x-12 gap-y-8">
                            <!-- Photo Column -->
                            <div class="flex justify-center items-start lg:items-center">
                                ${photoHTML}
                            </div>

                            <!-- Details Columns -->
                            <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8 text-gray-700 leading-relaxed">
                                <div class="space-y-6">
                                    <div><strong class="block text-gray-900">Hometown:</strong> ${coach.hometown}</div>
                                    <div><strong class="block text-gray-900">Favorite Soccer Team:</strong> ${coach.favoriteTeam}</div>
                                    <div><strong class="block text-gray-900">Favorite Meal:</strong> ${coach.favoriteMeal}</div>
                                    <div><strong class="block text-gray-900">Coaching License:</strong> ${coach.license}</div>
                                </div>
                                <div class="space-y-6">
                                    <div><strong class="block text-gray-900">Reason for Joining CUSC:</strong><p class="italic mt-1">"${coach.reason}"</p></div>
                                    <div><strong class="block text-gray-900">Coaching Philosophy:</strong><p class="italic mt-1">"${coach.philosophy}"</p></div>
                                </div>
                            </div>
                        </div>
                        ${teamsHTML}
                        <div class="text-center mt-10">
                            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-8">
                                ${emailLink}
                                <a href="#" id="share-coach-link" class="text-gray-500 hover:text-cu-red transition text-sm font-semibold flex items-center gap-2">
                                    <i class="fas fa-link"></i>
                                    <span id="share-link-text">Link to this coach</span>
                                </a>
                            </div>
                        </div>
                    </div>
                `;

                // --- Add event listener for the new copy-to-clipboard functionality ---
                const shareButton = document.getElementById('share-coach-link');
                if (shareButton) {
                    shareButton.addEventListener('click', (e) => {
                        e.preventDefault();
                        // Use 'http://' as a fallback for file:/// origins which are null
                        const origin = window.location.origin === 'null' ? 'http://cusc.pctony.com' : window.location.origin;
                        const shareLink = `${origin}${window.location.pathname}?coach=${encodeURIComponent(coach.name)}`;
                        const linkText = document.getElementById('share-link-text');

                        // Update URL in address bar without reloading
                        window.history.pushState({}, '', shareLink);

                        // Check for Clipboard API availability (requires HTTPS or localhost)
                        if (navigator.clipboard) {
                            navigator.clipboard.writeText(shareLink).then(() => {
                                linkText.textContent = 'Copied to clipboard!';
                            }).catch(err => {
                                console.error('Failed to copy link: ', err);
                                linkText.textContent = 'Could not copy!';
                            });
                        } else {
                            // Fallback for insecure contexts (like file://)
                            linkText.textContent = 'Please copy from address bar';
                        }

                        setTimeout(() => { linkText.textContent = 'Link to this coach'; }, 3000);
                    });
                }
            };

            // Populate the dropdown
            visibleCoaches.forEach((coach) => {
                // The 'value' of the option will be the coach's name for easier lookup
                const option = new Option(coach.name, coach.name);
                selector.add(option);
            });

            // Event listener for dropdown change
            selector.addEventListener('change', (e) => {
                // Find the coach object that matches the selected name
                const selectedCoach = visibleCoaches.find(c => c.name === e.target.value);
                displayCoach(selectedCoach);
            });

            // --- Logic to determine which coach to display on load ---
            let coachToDisplay = null;
            const urlParams = new URLSearchParams(window.location.search);
            const coachNameFromURL = urlParams.get('coach');

            // 1. Prioritize coach from URL parameter
            if (coachNameFromURL) {
                coachToDisplay = visibleCoaches.find(c => c.name === coachNameFromURL);
            }

            // 2. If no valid URL param, fall back to the designated default coach
            if (!coachToDisplay) {
                coachToDisplay = visibleCoaches.find(coach => coach.isDefault) || (visibleCoaches.length > 0 ? visibleCoaches[0] : null);
            }

            // Display the determined coach
            if (coachToDisplay) {
                selector.value = coachToDisplay.name;
                displayCoach(coachToDisplay);
            }
        });
    </script>
</body>
</html>
