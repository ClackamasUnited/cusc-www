<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Clackamas United | Home</title>
    <style>
        /*
            ============================================================
             CONTENT VISIBILITY CONTROLS -- read before editing
            ============================================================
             This page shows/hides each hero CTA button automatically
             based on the data-show-* attributes set on <body> below.
             This is done with plain CSS -- there is no JavaScript
             involved, so a change here takes effect the moment the
             page reloads.

             data-show-program-button         : "true" | "false"
             data-show-player-inquiry-button  : "true" | "false"
             data-show-reg-button             : "true" | "false"
             data-show-tryout-button          : "true" | "false"
             data-show-tryout-schedule-button : "true" | "false"
             data-show-rec-reg-button         : "true" | "false"
                 "true"  -> shows that button
                 "false" -> hides it (this is also the default/fail-safe)
            ============================================================
        */
        body .show-program-button,
        body .show-player-inquiry-button,
        body .show-reg-button,
        body .show-tryout-button,
        body .show-tryout-schedule-button,
        body .show-rec-reg-button { display: none; }

        [data-show-reg-button="true"] .show-reg-button { display: revert; } /* 'revert' restores this element's true browser-default display (block for div/p, inline for a/span) -- 'initial' looks similar but is NOT the same: per the CSS spec, 'initial' always resolves display to plain 'inline' regardless of tag, which silently breaks block-level elements like <div>/<p> (their background/border/shadow get fragmented across line-boxes). 'revert' is what we actually want here. */
        [data-show-tryout-button="true"] .show-tryout-button { display: revert; }
        [data-show-player-inquiry-button="true"] .show-player-inquiry-button { display: revert; }
        [data-show-tryout-schedule-button="true"] .show-tryout-schedule-button { display: revert; }
        [data-show-program-button="true"] .show-program-button { display: revert; }
        [data-show-rec-reg-button="true"] .show-rec-reg-button { display: revert; }
    </style>
</head>

<!--
    ============================================================
     CONTENT VISIBILITY CONTROL -- read before editing
    ============================================================
     data-show-program-button / data-show-player-inquiry-button /
     data-show-reg-button / data-show-tryout-button /
     data-show-tryout-schedule-button / data-show-rec-reg-button
         "true"  -> shows that button
         "false" -> hides it
     (Controlled with plain CSS in <head> above -- no JavaScript.)
    ============================================================
-->

            let currentImageIndex = 0;
            const bgImage = document.getElementById('bg-image');

            // Set the initial image from the array
            if (images.length > 0) bgImage.src = images[0];

            setInterval(() => {
